const API='https://tori-torkari-backend-1.onrender.com';

```js
async function updateOrderStatus(id) {
  const select = document.getElementById('status-' + id);
  const message = document.getElementById('status-message');
  const key = prompt('আপনার গোপন Admin Key লিখুন:');

  if (!key) return;

  try {
    const response = await fetch(
      API + '/api/orders/' + encodeURIComponent(id) + '/status',
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-key': key
        },
        body: JSON.stringify({ status: select.value })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Status পরিবর্তন করা যায়নি');
    }

    const index = orders.findIndex(o => o.id === id);
    if (index !== -1) orders[index] = data;

    message.textContent = 'অর্ডারের Status সফলভাবে পরিবর্তন হয়েছে।';
    show('orders');
  } catch (error) {
    message.textContent = 'সমস্যা: ' + error.message;
  }
}

## ধাপ ৫: সংরক্ষণ করুন

১. **Commit changes** চাপুন।
২. পরিবর্তন নিশ্চিত করে আবার **Commit changes** চাপুন।
৩. Netlify Deploy শেষ হওয়া পর্যন্ত অপেক্ষা করুন।

তারপর Admin Panel খুলে **Orders** পেজ পরীক্ষা করুন।

**মনে রাখবেন:** Admin Key কখনো কোডের মধ্যে লিখবেন না। আর আপনার বর্তমান Backend-এ অর্ডারগুলো মেমরিতে থাকে, তাই Backend পুনরায় চালু হলে সেগুলো হারাতে পারে। বাস্তব ব্যবহারের আগে স্থায়ী ডেটাবেসও যোগ করা দরকার।

কোড সংরক্ষণ হয়ে গেলে আমাকে **“হয়েছে”** লিখুন।
